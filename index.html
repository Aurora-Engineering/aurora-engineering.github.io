<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Aurora Engineering. Our new website is on its way.">
    <title>Aurora Engineering</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23132136'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial,sans-serif' font-size='40' font-weight='700' fill='white'%3EA%3C/text%3E%3C/svg%3E">
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #f8fafc;
        color: #132136;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main { width: 100%; max-width: 44rem; }

      .company {
        margin: 0 0 2rem;
        color: #375d87;
        font-size: 0.875rem;
        font-weight: 650;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.75rem, 9vw, 5.5rem);
        font-weight: 600;
        letter-spacing: -0.055em;
        line-height: 1.12;
      }

      .message {
        margin: 1.5rem 0 0;
        color: #526174;
        font-size: 1.125rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="company">Aurora Engineering</p>
      <h1>Hello, world.</h1>
      <p class="message">Our new website is on its way.</p>
    </main>
  </body>
</html>
